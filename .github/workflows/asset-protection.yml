name: Asset Protection Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, design/premium-visual-baseline-20261030]
  workflow_dispatch:
    inputs:
      verify_preview_http:
        description: Run read-only HTTP acceptance against the approved independent preview
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: asset-protection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  asset-preservation:
    name: asset-preservation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BB369_QA_ARTIFACT_DIR: ${{ runner.temp }}/bb369-acceptance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependency
        run: python -m pip install --disable-pip-version-check lxml==6.1.1
      - name: Check with trusted base manifest before candidate code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p "$BB369_QA_ARTIFACT_DIR"
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA:docs/asset-protection/manifest.json" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check-asset-manifest.py" > "$RUNNER_TEMP/bb369-trusted-checker.py"
            git show "$BASE_SHA:docs/asset-protection/manifest.json" > "$RUNNER_TEMP/bb369-trusted-manifest.json"
            python "$RUNNER_TEMP/bb369-trusted-checker.py" --root "$GITHUB_WORKSPACE" --manifest "$RUNNER_TEMP/bb369-trusted-manifest.json" --allow-new-assets --output "$BB369_QA_ARTIFACT_DIR/trusted-base.json"
          else
            echo 'Bootstrap: no trusted manifest exists in the base; requires owner review.'
          fi
      - name: Asset contracts and rejection tests
        run: |
          python scripts/check-asset-manifest.py --output "$BB369_QA_ARTIFACT_DIR/asset-contract.json"
          python tests/asset_manifest_guard.py
          git worktree add --detach "$RUNNER_TEMP/bb369-static-qa" HEAD
          cd "$RUNNER_TEMP/bb369-static-qa"
          python tests/organization-restoration.py
          python scripts/render-product-catalog.py --check
          python scripts/render-projects.py --check
          python scripts/sync-public-mirror.py --check
          python tests/stable-asset-lock.py
          python tests/final-visual-regression.py
      - name: Detect affected browser checks
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if git diff --name-only "$BASE_SHA" HEAD | python -c 'import re,sys; sys.exit(not any(re.search(r"(^public/.*\.(html|css|js|png|jpg|svg)$|^tests/.*\.(cjs|js)$|^\.github/workflows/)", p) for p in sys.stdin))'; then
              echo 'browser=true' >> "$GITHUB_OUTPUT"
            else
              echo 'browser=false' >> "$GITHUB_OUTPUT"
              echo 'UI runtime unchanged; asset hashes protect reused browser acceptance.'
            fi
          else
            echo 'browser=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.affected.outputs.browser == 'true'
        with:
          node-version: '24'
      - name: Isolated browser and form acceptance
        if: steps.affected.outputs.browser == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/bb369-qa" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/bb369-qa/node_modules/playwright/cli.js" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/bb369-qa/node_modules"
          node --test tests/*.test.cjs
          node tests/browser_public_site.cjs
      - name: Read-only preview URL acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.verify_preview_http
        run: python scripts/check-asset-manifest.py --http-base https://design-premium-visual-baseline-2026-bb369tech-corporate-website.bb369-ai.workers.dev --output "$BB369_QA_ARTIFACT_DIR/preview-http.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: asset-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/bb369-acceptance
          if-no-files-found: error
          retention-days: 14
